name: CI
on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - name: Begin CI...
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run --filter "./packages/*" build

      - name: Static checks
        run: vp check

      - name: TypeScript comparison
        run: pnpm run typecheck

      - name: Documentation examples
        run: node --test scripts/browser-docs*.test.mjs

      - name: Test
        run: vp run --filter "./packages/*" test

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./packages/logfire-session-replay/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

      # The Ubuntu mirror can take most of an hour to serve the ~110 MB of browser system
      # packages, so the downloaded packages are cached alongside the browsers themselves.
      - name: Restore browser cache
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: playwright-${{ steps.playwright.outputs.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        # A warm cache downloads no packages; only a cold one waits on the mirror.
        timeout-minutes: ${{ steps.browser-cache.outputs.cache-hit == 'true' && 10 || 30 }}
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true"; APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if compgen -G "$HOME/.cache/playwright-apt/*.deb" > /dev/null; then
            sudo cp "$HOME"/.cache/playwright-apt/*.deb /var/cache/apt/archives/
          fi
          vp exec --filter @pydantic/logfire-session-replay -- playwright install --with-deps chromium firefox webkit
          mkdir -p "$HOME/.cache/playwright-apt"
          cp /var/cache/apt/archives/*.deb "$HOME/.cache/playwright-apt/"

      # Saved right after installation, so a later test failure still warms the next run.
      - name: Save browser cache
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-apt
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Browser acceptance
        id: browser-acceptance
        env:
          REPLAY_BROWSER_MATRIX: all
        run: vp run @pydantic/logfire-session-replay#test:browser

      - name: Upload browser failure artifacts
        if: failure() && steps.browser-acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-results
          path: test-results
          retention-days: 7

      - name: Test release tooling
        run: node scripts/create-npm-token.test.mjs

      - name: Test docs preview dispatcher
        run: pnpm run test:docs-preview

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    # Cancelling a release mid-publish could leave npm and main out of step, so runs queue.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    environment:
      name: npm
    env:
      # The install's `vp config` would otherwise install the repository's git hooks, and the
      # pre-push hook rebuilds and tests on every version and tag push; parallel tag pushes
      # time those tests out and the tags are rejected.
      VP_GIT_HOOKS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tip, not the triggering commit, so the version commit still fast-forwards
          # when another PR merged while this run waited. A merge landing mid-run rejects
          # the push and fails this run; the next run versions both.
          ref: main

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install pnpm for publishing
        uses: pnpm/action-setup@v4

      - name: Select release mode
        id: select-mode
        uses: changesets/action/select-mode@v2

      # Versions are committed straight to main instead of through a Version Packages PR,
      # so merging a PR with a changeset releases it. Pushes made with GITHUB_TOKEN start no
      # workflow runs, so this commit does not loop back into CI. It is pushed before
      # publishing: if publishing then fails, the next run finds no changesets and publishes
      # whatever versions npm is missing.
      - name: Version packages
        if: steps.select-mode.outputs.mode == 'version'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          git add --all
          git commit --message "Version Packages"
          git push origin HEAD:main

      # Publishing authenticates through npm trusted publishing (OIDC via the id-token
      # permission and the npm environment); no registry token is involved. A brand-new
      # package cannot use OIDC for its first publish (npm/cli#8544): publish it once
      # locally, configure its trusted publisher on npmjs.com, and CI takes over.
      - name: Release
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          # The API push mode tags the triggering commit; the git CLI pushes the tags that
          # `changeset publish` creates on the version commit.
          push-with-git-cli: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
