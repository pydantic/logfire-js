name: CI
on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - name: Begin CI...
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run --filter "./packages/*" build

      - name: Static checks
        run: vp check

      - name: TypeScript comparison
        run: vp run --filter "./packages/*" typecheck

      - name: Test
        run: vp run --filter "./packages/*" test

      - name: Install Chromium
        run: vp exec --filter @pydantic/logfire-session-replay -- playwright install --with-deps chromium

      - name: Browser acceptance
        id: browser-acceptance
        run: vp run @pydantic/logfire-session-replay#test:browser

      - name: Upload browser failure artifacts
        if: failure() && steps.browser-acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-results
          path: test-results
          retention-days: 7

      - name: Test release tooling
        run: node scripts/create-npm-token.test.mjs

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    environment:
      name: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install pnpm for publishing
        uses: pnpm/action-setup@v4

      # Publishing authenticates through npm trusted publishing (OIDC via the id-token
      # permission and the npm environment); no registry token is involved. A brand-new
      # package cannot use OIDC for its first publish (npm/cli#8544): publish it once
      # locally, configure its trusted publisher on npmjs.com, and CI takes over.
      - name: Release
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
